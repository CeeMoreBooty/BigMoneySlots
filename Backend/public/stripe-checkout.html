<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Big Money Slots — Secure Checkout</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    /* ── PGCN Brand Palette ─────────────────────────────────────── */
    :root {
      --gold:        #FFD700;
      --gold-light:  #FFE84D;
      --gold-dark:   #B8960C;
      --dark:        #0D0D1A;
      --dark-card:   #161628;
      --dark-border: #2A2A4A;
      --green:       #00C896;
      --red:         #FF4B4B;
      --text:        #F0F0FF;
      --text-muted:  #8888AA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--dark);
      color: var(--text);
      font-family: 'Segoe UI', 'Arial', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── Header / Brand ─────────────────────────────────────────── */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-header .logo-ring {
      width: 72px; height: 72px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 12px;
      background: radial-gradient(circle at 40% 40%, #1a1a3a, #0D0D1A);
      box-shadow: 0 0 24px rgba(255,215,0,0.35);
      font-size: 32px;
    }
    .brand-header h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--gold);
      text-shadow: 0 0 12px rgba(255,215,0,0.4);
    }
    .brand-header .pgcn-tag {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: var(--text-muted);
      margin-top: 2px;
      text-transform: uppercase;
    }

    /* ── Checkout Card ──────────────────────────────────────────── */
    .checkout-card {
      background: var(--dark-card);
      border: 1px solid var(--dark-border);
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
    }

    /* ── Product summary ────────────────────────────────────────── */
    .product-summary {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: rgba(255,215,0,0.06);
      border: 1px solid rgba(255,215,0,0.18);
      border-radius: 10px;
      margin-bottom: 24px;
    }
    .product-icon { font-size: 36px; }
    .product-info { flex: 1; }
    .product-name { font-weight: 700; font-size: 1rem; color: var(--gold-light); }
    .product-desc { font-size: 0.82rem; color: var(--text-muted); margin-top: 2px; }
    .product-price {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--gold);
    }

    /* ── Section label ──────────────────────────────────────────── */
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    /* ── Stripe Element container ───────────────────────────────── */
    #card-element {
      background: #0D0D1A;
      border: 1px solid var(--dark-border);
      border-radius: 8px;
      padding: 14px 12px;
      transition: border-color 0.2s;
    }
    #card-element.focused { border-color: var(--gold); }
    #card-errors {
      color: var(--red);
      font-size: 0.83rem;
      margin-top: 8px;
      min-height: 18px;
    }

    /* ── Pay button ─────────────────────────────────────────────── */
    #pay-btn {
      margin-top: 22px;
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, var(--gold-dark), var(--gold));
      color: #0D0D1A;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      box-shadow: 0 4px 18px rgba(255,215,0,0.3);
    }
    #pay-btn:hover:not(:disabled) { opacity: 0.92; }
    #pay-btn:active:not(:disabled) { transform: scale(0.98); }
    #pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Status messages ────────────────────────────────────────── */
    #status-msg {
      margin-top: 16px;
      text-align: center;
      font-size: 0.9rem;
      min-height: 20px;
    }
    #status-msg.success { color: var(--green); }
    #status-msg.error   { color: var(--red); }

    /* ── Security badge row ─────────────────────────────────────── */
    .security-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 0.75rem;
    }
    .security-row svg { opacity: 0.6; }

    /* ── Footer ─────────────────────────────────────────────────── */
    .checkout-footer {
      margin-top: 18px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .checkout-footer a { color: var(--gold-dark); text-decoration: none; }

    /* ── Loading spinner ────────────────────────────────────────── */
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid rgba(13,13,26,0.4);
      border-top-color: #0D0D1A;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 480px) {
      .checkout-card { padding: 22px 16px; }
    }
  </style>
</head>
<body>

  <!-- Brand header -->
  <div class="brand-header">
    <div class="logo-ring">🎰</div>
    <h1>Big Money Slots</h1>
    <div class="pgcn-tag">PGCN · Secure Checkout</div>
  </div>

  <!-- Main card -->
  <div class="checkout-card">

    <!-- Product summary (populated by JS from URL params) -->
    <div class="product-summary">
      <div class="product-icon" id="prod-icon">💎</div>
      <div class="product-info">
        <div class="product-name" id="prod-name">Loading…</div>
        <div class="product-desc" id="prod-desc"></div>
      </div>
      <div class="product-price" id="prod-price"></div>
    </div>

    <!-- Card input -->
    <div class="section-label">Card Details</div>
    <div id="card-element"></div>
    <div id="card-errors"></div>

    <!-- Pay button -->
    <button id="pay-btn" disabled>Loading…</button>

    <!-- Status -->
    <div id="status-msg"></div>

    <!-- Security row -->
    <div class="security-row">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      256-bit SSL · Secured by Stripe
    </div>

    <!-- Footer -->
    <div class="checkout-footer">
      By completing this purchase you agree to our
      <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.<br/>
      All transactions are processed securely by Stripe.<br/>
      Questions? <a href="mailto:tech.crew151@gmail.com">tech.crew151@gmail.com</a>
    </div>
  </div>

  <script>
  (async () => {
    // ── Read URL params ─────────────────────────────────────────────────────
    const params    = new URLSearchParams(window.location.search);
    const productId = params.get('productId') || '';
    const jwt       = params.get('token')     || '';   // player JWT passed from Unity

    // ── Product catalog (mirrors Backend/routes/payments.js) ───────────────
    const PRODUCTS = {
      welcomeofferpack: { name: 'Welcome Offer Pack', desc: '150B Coins · 200 Free Spins · 25 Super Spins · VIP Badge', price: '$4.99', icon: '🎁' },
      gems_100:  { name: '100 Gems',    desc: 'Hard currency for exclusive items', price: '$0.99',  icon: '💎' },
      gems_500:  { name: '500 Gems',    desc: 'Hard currency for exclusive items', price: '$4.99',  icon: '💎' },
      gems_1200: { name: '1,200 Gems',  desc: 'Best value · Popular',              price: '$9.99',  icon: '💎' },
      gems_2500: { name: '2,500 Gems',  desc: 'Super value bundle',                price: '$19.99', icon: '💎' },
      gems_6500: { name: '6,500 Gems',  desc: 'Ultimate bundle · Most gems',       price: '$49.99', icon: '💎' },
    };

    const prod = PRODUCTS[productId];
    if (!prod) {
      document.getElementById('prod-name').textContent = 'Invalid product';
      document.getElementById('pay-btn').textContent   = 'Unavailable';
      return;
    }

    // ── Populate product summary ────────────────────────────────────────────
    document.getElementById('prod-icon').textContent  = prod.icon;
    document.getElementById('prod-name').textContent  = prod.name;
    document.getElementById('prod-desc').textContent  = prod.desc;
    document.getElementById('prod-price').textContent = prod.price;
    document.getElementById('pay-btn').textContent    = `Pay ${prod.price}`;

    // ── Fetch publishable key + create PaymentIntent ────────────────────────
    let clientSecret;
    try {
      const res = await fetch('/api/payments/stripe/create-payment-intent', {
        method:  'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': `Bearer ${jwt}`,
        },
        body: JSON.stringify({ productId }),
      });
      if (!res.ok) throw new Error((await res.json()).error || 'Server error');
      const data  = await res.json();
      clientSecret = data.clientSecret;
    } catch (err) {
      setStatus('error', '⚠ Could not start checkout: ' + err.message);
      return;
    }

    // ── Fetch publishable key ───────────────────────────────────────────────
    let publishableKey;
    try {
      const res = await fetch('/api/payments/stripe/config');
      publishableKey = (await res.json()).publishableKey;
    } catch (err) {
      setStatus('error', '⚠ Could not load Stripe config');
      return;
    }

    // ── Mount Stripe Elements ───────────────────────────────────────────────
    const stripeJs = Stripe(publishableKey);
    const elements = stripeJs.elements();

    const cardEl = elements.create('card', {
      style: {
        base: {
          color:           '#F0F0FF',
          fontFamily:      "'Segoe UI', Arial, sans-serif",
          fontSize:        '16px',
          '::placeholder': { color: '#4a4a6a' },
        },
        invalid: { color: '#FF4B4B' },
      },
    });

    cardEl.mount('#card-element');

    cardEl.on('focus',  () => document.getElementById('card-element').classList.add('focused'));
    cardEl.on('blur',   () => document.getElementById('card-element').classList.remove('focused'));
    cardEl.on('change', e => {
      document.getElementById('card-errors').textContent = e.error ? e.error.message : '';
    });

    // ── Enable pay button ───────────────────────────────────────────────────
    const btn = document.getElementById('pay-btn');
    btn.disabled = false;

    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Processing…';
      clearStatus();

      const { paymentIntent, error } = await stripeJs.confirmCardPayment(clientSecret, {
        payment_method: { card: cardEl },
      });

      if (error) {
        btn.disabled = false;
        btn.textContent = `Pay ${prod.price}`;
        setStatus('error', '✗ ' + error.message);
        return;
      }

      if (paymentIntent.status === 'succeeded') {
        btn.textContent = '✓ Payment successful!';
        setStatus('success', '🎉 Purchase complete! Returning to game…');

        // ── Notify Unity via deep link / custom scheme ──────────────────────
        setTimeout(() => {
          window.location.href =
            `bigmoneyslots://stripe/success?productId=${encodeURIComponent(productId)}&paymentIntentId=${paymentIntent.id}`;
        }, 2000);
      }
    });

    function setStatus(type, msg) {
      const el = document.getElementById('status-msg');
      el.textContent  = msg;
      el.className    = type;
    }
    function clearStatus() {
      const el = document.getElementById('status-msg');
      el.textContent = '';
      el.className   = '';
    }
  })();
  </script>

</body>
</html>
