name: Deploy Backend

on:
  push:
    branches: [main, master, Main, Wiseeeee]
    paths:
      - "Backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  # ── Option A: push Docker image to GHCR and SSH-deploy it ──────────────────
  docker-deploy:
    name: Build & Push Docker image, deploy via SSH
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          file: ./Backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bigmoneyslots-backend:latest
            ghcr.io/${{ github.repository_owner }}/bigmoneyslots-backend:${{ github.sha }}

      # ── SSH deploy (optional) ─────────────────────────────────────────────
      # Set these repository secrets to enable automatic SSH deployment:
      #   DEPLOY_HOST      – IP or hostname of your server
      #   DEPLOY_USER      – SSH user  (e.g. ubuntu)
      #   DEPLOY_KEY       – Private SSH key (the matching public key must be
      #                      in ~/.ssh/authorized_keys on the server)
      #   DEPLOY_PORT      – SSH port (default 22)
      - name: Deploy to server via SSH
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key:      ${{ secrets.DEPLOY_KEY }}
          port:     ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            IMAGE=ghcr.io/${{ github.repository_owner }}/bigmoneyslots-backend:latest

            # Authenticate with GHCR on the server (token stored as a server env var)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

            docker pull $IMAGE

            # Gracefully replace the running container
            docker stop bigmoneyslots-backend 2>/dev/null || true
            docker rm   bigmoneyslots-backend 2>/dev/null || true

            docker run -d \
              --name bigmoneyslots-backend \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /home/${{ secrets.DEPLOY_USER }}/bigmoneyslots/.env \
              $IMAGE

            docker image prune -f
