name: IdleDozer CI/CD

# ── Triggers ──────────────────────────────────────────────────────────────────
# • Every push / PR that touches files inside IdleDozer/
# • Manual trigger from the Actions tab
# • Push of a version tag (e.g. v1.0.1) → builds a signed release AAB
on:
  push:
    branches: ['**']
    tags:     ['v*.*.*']
    paths:    ['IdleDozer/**']
  pull_request:
    paths:    ['IdleDozer/**']
  workflow_dispatch:

defaults:
  run:
    working-directory: IdleDozer

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:

  # ── 1. Build debug APK (every push / PR) ────────────────────────────────────
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: idledozer-debug-${{ github.sha }}
          path: IdleDozer/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  # ── 2. Build signed release AAB (on version tag) ──────────────────────────
  build-release:
    name: Build & Sign Release AAB
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Decode the base64-encoded keystore stored as a GitHub Secret.
      # In the repo → Settings → Secrets → Actions, create:
      #   KEYSTORE_BASE64      : base64-encoded .jks file
      #                          (base64 -w0 idledozer-release.jks)
      #   KEYSTORE_PASSWORD    : your keystore password
      #   KEY_ALIAS            : idledozer
      #   KEY_PASSWORD         : your key password
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > idledozer-release.jks

      - name: Write keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=../idledozer-release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

      - name: Build signed release AAB
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: idledozer-release-${{ github.ref_name }}
          path: IdleDozer/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Optional: upload directly to the Play Store Internal Testing track.
      # Requires PLAY_STORE_JSON_KEY_BASE64 secret (base64-encoded service-account JSON).
      # Uncomment the block below once you have the key.
